# Gradle daemon memory. Compose + Room/KSP + Kotlin 2.4 don't fit the 512 MB default
# and fail with OutOfMemoryError halfway through a clean build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Reuse task outputs between builds (e.g. after `clean`, or switching branches).
org.gradle.caching=true

# AndroidX only. Harmless if AGP already treats this as the default.
android.useAndroidX=true

kotlin.code.style=official

# AGP 9 compiles Kotlin itself ("built-in Kotlin"). Do not add
# `android.builtInKotlin=false` or `android.newDsl=false`: build.gradle.kts is
# written for the defaults, and AGP 10 removes both opt-outs.
